{{- if .Values.opentelemetry.enabled }}
{{- if .Values.opentelemetry.scc.enabled }}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ include "ai-virtual-assistant.fullname" . }}-otel-scc
  labels:
    {{- include "ai-virtual-assistant.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: 'Custom SCC for OpenTelemetry auto-instrumentation that allows init containers while maintaining security restrictions'
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowPrivilegeEscalation: true  # Required for OpenTelemetry init containers
allowedCapabilities: 
- NET_BIND_SERVICE
defaultAddCapabilities: []
fsGroup:
  type: MustRunAs
groups: []
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
- KILL
- MKNOD
- SETUID
- SETGID
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
seccompProfiles:
- runtime/default
supplementalGroups:
  type: RunAsAny
users: []
volumes:
- configMap
- downwardAPI
- emptyDir
- persistentVolumeClaim
- projected
- secret
{{- end }}
{{- end }} 