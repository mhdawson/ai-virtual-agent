{{- if .Values.opentelemetry.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-virtual-assistant.fullname" . }}-otel-scc-user
  labels:
    {{- include "ai-virtual-assistant.labels" . | nindent 4 }}
rules:
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - {{ include "ai-virtual-assistant.fullname" . }}-otel-scc
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-virtual-assistant.fullname" . }}-otel-scc-binding
  labels:
    {{- include "ai-virtual-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-virtual-assistant.fullname" . }}-otel-scc-user
subjects:
- kind: ServiceAccount
  name: {{ include "ai-virtual-assistant.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }} 
